# DeepSeek-V4-Flash on 2x DGX Spark, TP=2 — adapted from MiaAI-Lab's recipe
# to run on STOCK vllm/vllm-openai:v0.27.1-aarch64 instead of the Anemll 0.25 port.
#
# Deltas from the upstream recipe are marked  # [DELTA]
# Unmarked settings were verified present in stock 0.27.1 via `vllm serve --help=all`.
#
# The command is a `bash -lc` string rather than a YAML list because --headless
# must be conditional per node (worker only) and an empty list entry becomes an
# empty argv token that argparse rejects. `$$` escapes compose interpolation so
# the CONTAINER shell expands it.
services:
  vllm-ds4:
    image: ${DS4_IMAGE:-vllm/vllm-openai:v0.27.1-aarch64}
    pull_policy: if_not_present
    entrypoint: []          # stock image ENTRYPOINT is ["vllm","serve"]; we call it ourselves
    network_mode: host
    ipc: host
    shm_size: "64gb"

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface
      - ${DS4_TMP_HOST:-${HOME}/.cache/ds4-tmp}:/tmp

    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache
      VLLM_LOGGING_LEVEL: "${VLLM_LOGGING_LEVEL:-INFO}"
      VLLM_HOST_IP: "${VLLM_HOST_IP}"
      # Worker sets HEADLESS=1; head leaves it empty. Consumed by the command below.
      HEADLESS: "${HEADLESS:-}"

      # GB10-native kernel targeting (plain env — carries over to the stock image)
      TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-12.1a}"
      FLASHINFER_CUDA_ARCH_LIST: "${FLASHINFER_CUDA_ARCH_LIST:-12.1a}"
      CUTE_DSL_ARCH: "${CUTE_DSL_ARCH:-sm_121a}"
      FLASHINFER_WORKSPACE_BASE: "${FLASHINFER_WORKSPACE_BASE:-/cache/huggingface/flashinfer}"
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"
      VLLM_USE_FLASHINFER_SAMPLER: "${VLLM_USE_FLASHINFER_SAMPLER:-1}"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "${VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS:-1}"
      # A/B knob: Mia's recipe sets 0 (+28.6% decode claimed); vLLM auto-enables 1,
      # which disables the torch.compile pipeline entirely.
      VLLM_USE_BREAKABLE_CUDAGRAPH: "${VLLM_USE_BREAKABLE_CUDAGRAPH:-1}"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "${VLLM_ALLOW_LONG_MAX_MODEL_LEN:-1}"
      # [DELTA] DeepGEMM asserts "Unknown SF transformation" on this checkpoint's
      # ue8m0 FP8 scales on sm_121. CUTLASS FP8 is verified working on this GPU.
      VLLM_USE_DEEP_GEMM: "${VLLM_USE_DEEP_GEMM:-1}"
      VLLM_MOE_USE_DEEP_GEMM: "${VLLM_MOE_USE_DEEP_GEMM:-1}"
      VLLM_USE_DEEP_GEMM_E8M0: "${VLLM_USE_DEEP_GEMM_E8M0:-1}"

      # --- RoCE fabric: THIS cluster's verified values (…f0; template's …f1 are DOWN) ---
      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_IB_HCA: "${NCCL_IB_HCA:-rocep1s0f0}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME:-enp1s0f0np0}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME:-enp1s0f0np0}"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME:-enp1s0f0np0}"
      # [DELTA] GID index left UNSET so NCCL auto-selects per node — upstream warns
      # a shared literal across ranks can wedge NCCL at init. Set only if init fails.
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_IB_ADDR_FAMILY: "${NCCL_IB_ADDR_FAMILY:-AF_INET}"
      NCCL_IB_ROCE_VERSION_NUM: "${NCCL_IB_ROCE_VERSION_NUM:-2}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"

      NODE_RANK: "${NODE_RANK}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"

    command:
      - bash
      - -lc
      - >
        exec vllm serve ${DS4_MODEL:-deepseek-ai/DeepSeek-V4-Flash-0731}
        --revision ${DS4_REVISION:-9e165c30e2704aec5d9d593cce3eebd58bbef1cb}
        --served-model-name ${SERVED_MODEL_NAME:-deepseek-v4-flash}
        --host ${VLLM_HOST:-0.0.0.0}
        --port ${VLLM_PORT:-8888}
        --trust-remote-code
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --kv-cache-dtype ${KV_CACHE_DTYPE:-fp8_ds_mla}
        --block-size 256
        --max-model-len ${MAX_MODEL_LEN:-262144}
        --max-num-seqs ${MAX_NUM_SEQS:-4}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-8192}
        --max-cudagraph-capture-size ${MAX_CUDAGRAPH_CAPTURE_SIZE:-48}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.80}
        --enable-prefix-caching
        --enable-chunked-prefill
        --async-scheduling
        --speculative-config '{"method":"dspark","num_speculative_tokens":${MTP_NUM_TOKENS:-5},"draft_sample_method":"probabilistic"}'
        --tokenizer-mode deepseek_v4
        --distributed-executor-backend mp
        --moe-backend ${MOE_BACKEND:-auto}
        --tool-call-parser deepseek_v4
        --enable-auto-tool-choice
        --reasoning-parser deepseek_v4
        --generation-config vllm
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25000}
        $${HEADLESS:+--headless}
